name: CI/CD · Vercel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Validar secrets requeridos
        shell: bash
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=(VERCEL_TOKEN)
          [ -z "$VERCEL_ORG_ID" ] && missing+=(VERCEL_ORG_ID)
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=(VERCEL_PROJECT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Obtener configuración de Vercel
        run: npx --yes vercel@50.38.3 pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token="$VERCEL_TOKEN"

      - name: Construir artefacto
        run: npx --yes vercel@50.38.3 build ${{ github.event_name == 'pull_request' && '' || '--prod' }} --token="$VERCEL_TOKEN"

      - name: Desplegar Preview
        if: github.event_name == 'pull_request'
        run: |
          url=$(npx --yes vercel@50.38.3 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "### Preview desplegada" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Desplegar Production
        if: github.event_name != 'pull_request'
        run: |
          url=$(npx --yes vercel@50.38.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "### Production desplegada" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
